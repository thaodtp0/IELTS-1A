
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS 1A - Practice Hub</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #FBF9F1;
            color: #2D3748;
        }

        h1, h2 {
            font-family: 'Fredoka', sans-serif;
        }

        summary {
            list-style: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        .semester-arrow {
            transition: transform 0.25s ease;
        }

        details[open] .semester-arrow {
            transform: rotate(180deg);
        }
    </style>
</head>

<body class="min-h-screen py-12 px-4">

    <!-- PAGE TITLE -->
    <header class="max-w-3xl mx-auto text-center space-y-3 mb-10">

        <h1 class="text-4xl md:text-5xl font-bold text-slate-800 tracking-wide">
            IELTS 1A
        </h1>

        <p class="text-slate-600 font-medium text-sm md:text-base">
            Collection of practice materials categorized by semesters and lessons.
        </p>

        <div class="w-1/2 mx-auto border-b-2 border-slate-300 pt-2"></div>

    </header>

    <main class="max-w-3xl mx-auto space-y-6">

        <!-- ========== SEMESTER 6 ========== -->
        <details open class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group">

            <summary class="flex justify-between items-center p-5 bg-amber-50/60 font-bold text-xl text-amber-900 cursor-pointer select-none">

                <span>
                    📚 Semester 6

                    <span class="text-xs bg-amber-200 text-amber-800 px-2 py-1 rounded-full ml-2">
                        Current
                    </span>
                </span>

                <span class="semester-arrow text-sm text-slate-400">
                    ▼
                </span>

            </summary>

            <div id="semester6-lessons" class="p-4 space-y-2">
                <div class="p-4 text-center text-slate-400 text-sm">
                    Loading lessons...
                </div>
            </div>

        </details>


        <!-- ========== SEMESTER 5 ========== -->
        <details class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group">

            <summary class="flex justify-between items-center p-5 bg-slate-50 font-bold text-xl text-slate-700 cursor-pointer select-none">

                <span>📚 Semester 5</span>

                <span class="semester-arrow text-sm text-slate-400">
                    ▼
                </span>

            </summary>

            <div id="semester5-lessons" class="p-4 space-y-2">
                <div class="p-4 text-center text-slate-400 text-sm">
                    Loading lessons...
                </div>
            </div>

        </details>


        <!-- ========== SEMESTER 4 ========== -->
        <details class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden group">

            <summary class="flex justify-between items-center p-5 bg-slate-50 font-bold text-xl text-slate-700 cursor-pointer select-none">

                <span>📚 Semester 4</span>

                <span class="semester-arrow text-sm text-slate-400">
                    ▼
                </span>

            </summary>

            <div id="semester4-lessons" class="p-4 space-y-2">
                <div class="p-4 text-center text-slate-400 text-sm">
                    Loading lessons...
                </div>
            </div>

        </details>

    </main>


    <script>

        // =====================================
        // GITHUB CONFIGURATION
        // =====================================

        const GITHUB_OWNER = 'thaodtp0';

        const semesters = [
            {
                semester: 6,
                repo: 'IELTS-1A',
                folder: 'semester6',
                containerId: 'semester6-lessons',
                current: true
            },
            {
                semester: 5,
                repo: 'IELTS-1A',
                folder: '',
                containerId: 'semester5-lessons',
                current: false
            },
            {
                semester: 4,
                repo: 'IELTS-A_S4',
                folder: '',
                containerId: 'semester4-lessons',
                current: false
            }
        ];


        // =====================================
        // FETCH LESSONS FROM GITHUB
        // =====================================

        async function fetchLessons(config) {

            const container = document.getElementById(
                config.containerId
            );

            const folderPath = config.folder
                ? '/' + config.folder
                : '';

            const apiUrl =
                `https://api.github.com/repos/${GITHUB_OWNER}/${config.repo}/contents${folderPath || '/'}`;

            try {

                const response = await fetch(apiUrl, {
                    cache: 'no-store',
                    headers: {
                        'Accept': 'application/vnd.github+json'
                    }
                });

                if (!response.ok) {
                    throw new Error(
                        `GitHub API error: ${response.status}`
                    );
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error('Unexpected GitHub response');
                }

                // Find lesson1, lesson2, lesson3...
                const lessonFolders = data
                    .filter(item =>
                        item.type === 'dir' &&
                        /^lesson\d+$/i.test(item.name)
                    )
                    .sort((a, b) => {

                        const numA = parseInt(
                            a.name.replace(/\D/g, ''), 10
                        );

                        const numB = parseInt(
                            b.name.replace(/\D/g, ''), 10
                        );

                        return numA - numB;
                    });


                // No lessons
                if (lessonFolders.length === 0) {

                    container.innerHTML = `
                        <div class="p-4 text-center text-slate-400 text-sm italic">
                            No lessons available yet.
                        </div>
                    `;

                    return;
                }


                // Clear loading message
                container.innerHTML = '';


                lessonFolders.forEach((folder, index) => {

                    const match = folder.name.match(/\d+/);

                    const lessonNum = parseInt(match[0], 10);

                    const formattedNum = String(
                        lessonNum
                    ).padStart(2, '0');


                    // Build lesson path
                    const lessonPath = config.folder
                        ? `${config.folder}/${folder.name}/`
                        : `${folder.name}/`;


                    // Link to GitHub Pages
                    const lessonUrl =
                        `https://${GITHUB_OWNER}.github.io/${config.repo}/${lessonPath}`;


                    // Lesson row
                    const row = document.createElement('div');

                    row.className =
                        'flex items-center justify-between gap-3 p-4 hover:bg-slate-50 rounded-lg transition ' +
                        (index < lessonFolders.length - 1
                            ? 'border-b border-slate-100'
                            : '');


                    // Left area
                    const left = document.createElement('div');

                    left.className =
                        'flex items-center space-x-4';


                    // Lesson number
                    const number = document.createElement('span');

                    number.className =
                        config.current
                        ? 'text-lg font-bold text-amber-700 font-mono'
                        : 'text-lg font-bold text-slate-500 font-mono';

                    number.textContent = formattedNum;


                    // Lesson title
                    const title = document.createElement('span');

                    title.className =
                        'font-bold text-slate-800';

                    title.textContent = `Lesson ${lessonNum}`;


                    left.appendChild(number);
                    left.appendChild(title);


                    // Open exercise link
                    const link = document.createElement('a');

                    link.href = lessonUrl;
                    link.textContent = 'Open Exercise';

                    link.className =
                        'text-sm font-bold text-slate-700 underline hover:text-sky-600 transition whitespace-nowrap';

                    if (config.semester === 4) {
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                    }


                    row.appendChild(left);
                    row.appendChild(link);

                    container.appendChild(row);

                });

            } catch (error) {

                console.error(
                    `Could not load Semester ${config.semester}:`,
                    error
                );

                container.innerHTML = `
                    <div class="p-4 text-center text-rose-500 text-sm">
                        Unable to load lessons.
                        Please refresh the page later.
                    </div>
                `;
            }

        }


        // =====================================
        // INITIALIZE ALL SEMESTERS
        // =====================================

        document.addEventListener('DOMContentLoaded', () => {

            semesters.forEach(config => {
                fetchLessons(config);
            });

        });

    </script>

</body>
</html>
